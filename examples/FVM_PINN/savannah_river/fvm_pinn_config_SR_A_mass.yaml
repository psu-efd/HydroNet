# SR-A-mass — Physics-only FVM-PINN on Savannah River + mass conservation
#
# Identical to SR-A (FVM residual + IC + BC only; no SRH-2D anchor, no
# measurements, no teacher) plus the nested control-volume mass-balance
# loss (training.mass_conservation). SR-A converged to near-still water:
# the inlet discharge vanished within ~100 m because the few violating
# cells were averaged away in the per-cell residual. The region balances
#   E_k = sum_{i in region k} A_i (dxi/dt + R_xi,i) = dV_k/dt + net outflow
# are signed, area-weighted sums, so a systematic loss of water cannot
# average out. They need no prescribed discharge (inflow enters through the
# inlet ghost flux), so the same term carries over to the gauge-only setup.
#
# Difference from SR-A:
#   - training.mass_conservation.enabled: true
#   - checkpoint_dir: ./checkpoints/SR_A_mass

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 0.5
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 29.3
  h_dry: 0.1
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 187.4}
  2: {type: "exit-h",  value: 29.3}
  3: {type: "wall"}
  4: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 29.3

data:
  srhhydro: "data/savana_SI.srhhydro"
  srh2d_h5_file: "data/Savana_XMDFC.h5"

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   3600.0

  adam_epochs: 10000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2500
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 0.0        # <-- physics-only: SR-A defining switch

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  mass_conservation:
    enabled: true
    lambda_mass: 1.0      # weight of mean((E_k / flux_scale)^2)
    n_regions: 10         # nested regions along the channel (last = whole domain)
    upstream_bc: [1]      # BC id(s) marking the upstream end
    flux_scale: null      # m^3/s; null = prescribed inlet Q (187.4)

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/SR_A_mass"
