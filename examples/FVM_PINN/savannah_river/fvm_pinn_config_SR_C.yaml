# SR-C — Time-window FVM-PINN (5 windows) on Savannah River
#
# Purpose: demonstrate causality enforcement via time-window decomposition
# on a long simulation. Expected to beat SR-B (single-window standard) by
# ~5-7x on L2(h) because each sub-network spans only ~720 s (vs 3600 s).
#
# Per-window trainer inherits the shared training.* block; only
# training.window.* controls the window decomposition.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 0.5
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 29.3
  h_dry: 0.1
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 187.4}
  2: {type: "exit-h",  value: 29.3}
  3: {type: "wall"}
  4: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 29.3

data:
  srhhydro: "data/savana_SI.srhhydro"
  srh2d_h5_file: "data/Savana_XMDFC.h5"

training:
  strategy: "window"
  t_start: 0.0
  t_end:   3600.0

  # Per-window budgets (StandardTrainer runs inside each window)
  adam_epochs: 4000         # per window -> 5 * 4000 = 20k total
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 1500
  lbfgs_epochs: 300
  n_time_samples: 10

  window:
    n_windows: 5
    overlap_frac: 0.10
    warm_start: true
    lambda_continuity: 5.0

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/SR_C"
