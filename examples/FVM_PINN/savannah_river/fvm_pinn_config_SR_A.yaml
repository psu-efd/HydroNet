# SR-A — Physics-only FVM-PINN on Savannah River (no data guidance)
#
# Purpose: real-world counterpart to BIC-A. The network is trained with
# the FVM residual + initial condition + boundary conditions only —
# no SRH-2D anchor, no sparse measurements, no teacher trajectory.
#
# Expected behaviour: poor accuracy at t = 3600 s. With a 1-hour
# simulation horizon on a 1306-cell unstructured mesh, a single PINN
# without any data signal struggles to enforce temporal causality and
# typically drifts at late times (the well-known long-horizon PINN
# failure mode). This run is included specifically to motivate the
# data-guided variants (SR-B...SR-G) and to mirror the BIC-A vs.
# BIC-B...H contrast in Case 3.
#
# Difference from SR-B (standard + SRH-2D anchor):
#   - lambda_data: 10.0 -> 0.0  (the only structural change)
#
# All other settings (network, IC, BC, optimizer schedule) are
# identical to SR-B for a clean ablation.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 0.5
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 29.3
  h_dry: 0.1
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 187.4}
  2: {type: "exit-h",  value: 29.3}
  3: {type: "wall"}
  4: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 29.3

data:
  srhhydro: "data/savana_SI.srhhydro"
  srh2d_h5_file: "data/Savana_XMDFC.h5"

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   3600.0

  adam_epochs: 10000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2500
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 0.0        # <-- physics-only: SR-A defining switch

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/SR_A"
