# SR_B_SF_FL -- SR_B_SF with the flat-start SRH-2D reference; only the h5 file and checkpoint directory differ
# SR-B-SF — Savannah River, standard (strong-form) PINN baseline: dense SRH-2D anchor (5 snapshots)
#
# Reviewer R3-B2: same network, Fourier features, IC/BC/data losses, loss
# weights and Adam + L-BFGS schedule as SR-B; only the physics residual
# changes from the well-balanced Roe FVM residual to the pointwise SWE
# residual (lambda_fvm weights it). Compare with SR-B.
#
# Difference from SR-B: training.loss_type = "strong_form".
#
device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 0.5
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 29.3
  h_dry: 0.1
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 187.4}
  2: {type: "exit-h",  value: 29.3}
  3: {type: "wall"}
  4: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 29.3

data:
  srhhydro: "data/savana_SI.srhhydro"
  srh2d_h5_file: "data_savannah_flat/Savana_flat_5snap_XMDFC.h5"

training:
  strategy: "standard"
  # Pointwise strong-form SWE residual by autograd at the cell centres
  # instead of the FVM residual; everything else as SR-B
  loss_type: "strong_form"
  t_start: 0.0
  t_end:   3600.0

  adam_epochs: 10000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2500
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0       # SRH-2D snapshots (5 anchor times) as training data

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/SR_B_SF_FL"
