# BICU-TX450 — R2-4 temporal extrapolation: BICU-T distilled from the FVM solver on
# [360, 450] s only. Evaluated afterwards on (450, 600] s, outside the training window.
#
device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true
  fourier_scale_t: 10.0       # periods down to ~60 s over the 240 s window

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  # Inflow pulse after a 360 s spin-up; t in s, Q in m^3/s.
  # Must match data/hydrograph/inflow_hydrograph.xys (t in h there).
  1:
    type: "inlet-q"
    hydrograph: [[0.0, 0.38], [360.0, 0.38], [390.0, 0.76], [480.0, 0.38], [600.0, 0.38]]
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "srh2d-snapshot"      # SRH-2D state at t_start = 360 s (end of spin-up)

data:
  srhhydro: "data/block_in_channel.srhhydro"   # mesh + materials (BCs come from this YAML)
  srh2d_h5_file: "data/hydrograph/block_in_channel_hydrograph_XMDFC.h5"
evaluation:
  # Rise 360-390 s, peak 390 s, recession to 480 s. Odd multiples of 10 s are
  # never dense snapshots (those are every 30 s), so they are held out in E/H.
  times: [370.0, 380.0, 390.0, 400.0, 420.0, 450.0, 480.0, 540.0, 600.0]

training:
  strategy: "teacher"
  t_start: 360.0
  t_end:   450.0
  teacher:
    n_snapshots: 18          # FVM trajectory every 5 s up to 450 s
    cfl: 0.3
    adam_epochs: 3000
    lbfgs_steps: 200
    phys_warmup: 200
    lr: 1.0e-3
    lambda_bc:     1.0
    lambda_phys:   0.05
    lambda_anchor: 0.0       # no SRH-2D data of any kind
    regen_trajectory: false
    trajectory_cache: ""

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BICU_TX450"
