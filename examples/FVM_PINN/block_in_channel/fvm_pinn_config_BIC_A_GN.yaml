# BIC-A-GN — Physics-only BIC-A with learning-rate annealing of the loss weights
#
# Purpose: test whether the BIC-A failure is an artefact of the static,
# hand-tuned weights (Reviewer 3, R3-C5). lambda_ic and lambda_bc are
# rebalanced every 10 Adam steps by gradient-norm matching (Wang, Teng &
# Perdikaris 2021, Algorithm 1); lambda_fvm stays 1, data stays off.
# The configured lambda_ic / lambda_bc are only the starting values.
#
# Difference from BIC-A: training.loss_weighting block only.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 0.38}
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 0.4

data:
  # Kept so evaluate_and_plot() can compare against SRH-2D; the trainer
  # ignores it at runtime via loss_weights.lambda_data = 0.
  srhhydro: "data/block_in_channel.srhhydro"
  srh2d_h5_file: "data/block_in_channel_XMDFC.h5"

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   360.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 0.0        # <-- physics-only (the BIC-A defining switch)

  loss_weighting:
    method: "grad_norm"
    update_every: 10        # Adam steps between weight updates
    alpha: 0.9              # moving-average factor for lambda_hat

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BIC_A_GN"
