# BIC-A-TM — Physics-only BIC-A with a time-marching curriculum
#
# Purpose: R3-C5 (Krishnapriyan et al. 2021). [0, 360] s split into 10
# windows trained in sequence; each window's IC is the previous window's
# end state, weights are warm-started. Per-window schedule as SR-D
# (3000 Adam + 200 L-BFGS). No data.
#
# Difference from BIC-A: strategy window + window block + per-window schedule.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 0.38}
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 0.4

data:
  # Kept so evaluate_and_plot() can compare against SRH-2D; the trainer
  # ignores it at runtime via loss_weights.lambda_data = 0.
  srhhydro: "data/block_in_channel.srhhydro"
  srh2d_h5_file: "data/block_in_channel_XMDFC.h5"

training:
  strategy: "window"
  t_start: 0.0
  t_end:   360.0

  adam_epochs: 3000         # per window -> 10 * 3000 = 30k total
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 1000
  lbfgs_epochs: 200
  n_time_samples: 10

  window:
    n_windows: 10
    overlap_frac: 0.10
    warm_start: true
    lambda_continuity: 5.0

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 0.0        # <-- physics-only (the BIC-A defining switch)

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BIC_A_TM"
