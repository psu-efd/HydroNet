# BIC-A-SAS — BIC-A-SA with plain gradient ascent (SGD) on the point weights
#
# Purpose: R3-C5. One trainable weight per cell (FVM residual, IC) and per
# boundary point (each BC), updated by gradient ascent (McClenny &
# Braga-Neto 2023), so that e.g. the inlet points can gain a large weight.
# Loss terms become mean(w^q r^2); the scalar lambda_* still multiply them.
# Weights are frozen for L-BFGS.
#
# Why a second SA run: with Adam every weight grows at ~lr per step because
# all its gradients are positive, so points are barely told apart. With SGD
# the growth rate is lambda * r_i^2 / N, i.e. set by each point's own error.
# Linear mask (q = 1) so the growth is not exponential in w.
#
# Difference from BIC-A-SA: q, optimizer, lr.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 0.38}
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 0.4

data:
  # Kept so evaluate_and_plot() can compare against SRH-2D; the trainer
  # ignores it at runtime via loss_weights.lambda_data = 0.
  srhhydro: "data/block_in_channel.srhhydro"
  srh2d_h5_file: "data/block_in_channel_XMDFC.h5"

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   360.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 0.0        # <-- physics-only (the BIC-A defining switch)

  loss_weighting:
    method: "self_adaptive"
    groups: ["fvm", "ic", "bc"]
    q: 1                    # mask m(w) = w^q
    init: 1.0
    optimizer: "sgd"        # gradient ascent ("adam" or "sgd")
    lr: 10.0                # ~3e-3/step growth on high-error points (CPU smoke test)

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BIC_A_SAS"
