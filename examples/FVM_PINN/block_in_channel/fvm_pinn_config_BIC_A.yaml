# BIC-A — Physics-only FVM-PINN on block-in-channel (no data guidance)
#
# Purpose: demonstrate the "physics-only FVM-PINN collapses to a trivial
# low-momentum state on realistic 2D domains" failure mode that motivates
# data-guided training (manuscript §5.3, claim C3).
#
# Difference from base config:
#   - strategy:   teacher -> standard
#   - loss_weights.lambda_data = 0.0  (SRH-2D snapshots are loaded but NOT
#     used for training; they are still available to evaluate_and_plot()
#     for metrics)
#   - lambda_fvm = 1.0 stays on so the FVM residual is the only driver
#
# Expected outcome: L2(|V|) ~ O(10^-1), near the "no-flow" baseline — the
# headline failure finding.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 0.38}
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 0.4

data:
  # Kept so evaluate_and_plot() can compare against SRH-2D; the trainer
  # ignores it at runtime via loss_weights.lambda_data = 0.
  srhhydro: "data/block_in_channel.srhhydro"
  srh2d_h5_file: "data/block_in_channel_XMDFC.h5"

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   360.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 0.0        # <-- physics-only (the BIC-A defining switch)

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BIC_A"
