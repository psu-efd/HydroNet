# BICU-GTX540 — R2-4 temporal extrapolation: as BICU-GT but started from BICU-TX540 and
# with the 10 velocity gauges only up to t = 540 s. The window runs to 600 s, so
# (540, 600] s is a forecast with the inflow hydrograph known, no physics loss (lambda_fvm = 0).
device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true
  fourier_scale_t: 10.0       # periods down to ~60 s over the 240 s window

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  # Inflow pulse after a 360 s spin-up; t in s, Q in m^3/s.
  # Must match data/hydrograph/inflow_hydrograph.xys (t in h there).
  1:
    type: "inlet-q"
    hydrograph: [[0.0, 0.38], [360.0, 0.38], [390.0, 0.76], [480.0, 0.38], [600.0, 0.38]]
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "srh2d-snapshot"      # SRH-2D state at t_start = 360 s (end of spin-up)

data:
  srhhydro: "data/block_in_channel.srhhydro"   # mesh + materials (BCs come from this YAML)
  srh2d_h5_file: "data/hydrograph/block_in_channel_hydrograph_XMDFC.h5"
  measurements:
    mode: "sparse"
    n_points: 10              # 10 fixed gauges (same cells as BICU-B, same seed)
    fixed_locations: true
    times: [360.0, 370.0, 380.0, 390.0, 400.0, 410.0, 420.0, 430.0, 440.0, 450.0, 460.0, 470.0, 480.0, 490.0, 500.0, 510.0, 520.0, 530.0, 540.0]   # gauges up to 540 s only
    variables: ["hu", "hv"]
    noise_sigma: 0.0
    seed: 42
evaluation:
  # Rise 360-390 s, peak 390 s, recession to 480 s. Odd multiples of 10 s are
  # never dense snapshots (those are every 30 s), so they are held out in E/H.
  times: [370.0, 380.0, 390.0, 400.0, 420.0, 450.0, 480.0, 540.0, 600.0]

training:
  strategy: "standard"
  t_start: 360.0
  t_end:   600.0

  # Start from the FVM-distilled network (weights + input normalisation)
  init_from: "./checkpoints/BICU_TX540/teacher_final.pt"
  adam_epochs: 4000
  adam_lr: 1.0e-4           # small steps: stay in the teacher's basin
  adam_lr_decay: 0.5
  adam_decay_every: 1000
  lbfgs_epochs: 300
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  0.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BICU_GTX540"
