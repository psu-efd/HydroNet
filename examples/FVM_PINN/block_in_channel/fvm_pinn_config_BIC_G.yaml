# BIC-G — Data-only baseline (lambda_fvm = 0) with sparse measurements
#
# Paired with BIC-B: same 200 velocity measurements, but the FVM residual
# is turned off. Tests whether supervising a handful of cells with no
# physics is enough to recover the full flow field, or whether the FVM
# residual is doing real work in the interior / wet-dry fringe.
#
# Expected: noticeably worse than BIC-B on the unmeasured cells,
# particularly near the block wake where physics propagates information.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 0.38}
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 0.4

data:
  srhhydro: "data/block_in_channel.srhhydro"
  srh2d_h5_file: "data/block_in_channel_XMDFC.h5"
  measurements:
    mode: "sparse"
    n_points: 200
    times: [360.0]
    variables: ["hu", "hv"]
    noise_sigma: 0.0
    seed: 42

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   360.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  0.0           # <-- FVM residual OFF (BIC-G defining switch)
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BIC_G"
