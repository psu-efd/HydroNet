# BIC-E — FVM-PINN + sparse measurements (200) + dense SRH-2D snapshots
#
# Best-accuracy row of the ablation matrix. The 200 velocity measurements
# anchor the steady-state result while the dense SRH-2D snapshots
# constrain the transient evolution.
#
# Uses the "both" measurement mode — concatenates the sparse vel-only
# block with the dense all-variable block into a single ref_data dict
# with per-point var_mask.

device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  1: {type: "inlet-q", value: 0.38}
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "flat-wse"
  wse_init: 0.4

data:
  srhhydro: "data/block_in_channel.srhhydro"
  srh2d_h5_file: "data/block_in_channel_XMDFC.h5"
  measurements:
    mode: "both"
    n_points: 200
    sparse_times: [360.0]        # velocity measurements at steady state
    # dense_times: []            # empty -> all in-window SRH-2D snapshots
    variables: ["hu", "hv"]
    noise_sigma: 0.0
    seed: 42

training:
  strategy: "standard"
  t_start: 0.0
  t_end:   360.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BIC_E"
