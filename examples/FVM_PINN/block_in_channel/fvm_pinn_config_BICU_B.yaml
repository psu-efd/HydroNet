# BICU-B — Unsteady block-in-channel (inflow pulse): FVM-PINN + 10 fixed depth gauges (every 10 s)
#
# Unsteady case for R1-M3 / R2-5: the steady BIC flow (Q = 0.38 m^3/s) at
# t = 360 s is hit by an inflow pulse to 0.76 m^3/s (peak at 390 s, back to
# 0.38 by 480 s). Trained on [360, 600] s. Reference: SRH-2D with the same
# hydrograph (data/hydrograph/README.md). Schedule and network as BIC-A.
#
device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  # Inflow pulse after a 360 s spin-up; t in s, Q in m^3/s.
  # Must match data/hydrograph/inflow_hydrograph.xys (t in h there).
  1:
    type: "inlet-q"
    hydrograph: [[0.0, 0.38], [360.0, 0.38], [390.0, 0.76], [480.0, 0.38], [600.0, 0.38]]
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "srh2d-snapshot"      # SRH-2D state at t_start = 360 s (end of spin-up)

data:
  srhhydro: "data/block_in_channel.srhhydro"   # mesh + materials (BCs come from this YAML)
  srh2d_h5_file: "data/hydrograph/block_in_channel_hydrograph_XMDFC.h5"
  measurements:
    mode: "sparse"
    n_points: 10              # 10 fixed depth gauges
    fixed_locations: true
    times: []                 # every SRH-2D output (10 s)
    variables: ["xi"]         # water level only
    noise_sigma: 0.0
    seed: 42
evaluation:
  # Rise 360-390 s, peak 390 s, recession to 480 s. Odd multiples of 10 s are
  # never dense snapshots (those are every 30 s), so they are held out in E/H.
  times: [370.0, 380.0, 390.0, 400.0, 420.0, 450.0, 480.0, 540.0, 600.0]

training:
  strategy: "standard"
  t_start: 360.0
  t_end:   600.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BICU_B"
