# BICU-ET — Unsteady block-in-channel (inflow pulse): physics + gauges + dense, time Fourier scale 30
#
# Follow-up to BICU-A/B/E/H: E and H under-fit the pulse, even at their own
# training snapshots, because with fourier_scale 1 the time embedding is
# too smooth for a 30 s rise and ~15 s surges. Trained on [360, 600] s;
# reference SRH-2D (data/hydrograph/README.md).
#
# Difference from BICU-E: model.fourier_scale_t = 30
#
device:
  type: "cuda"
  index: 0

model:
  name: "FVM_SWE_PINN"
  arch: "mlp"
  hidden_dim: 128
  n_layers: 6
  n_fourier: 64
  fourier_scale: 1.0
  activation: "tanh"
  use_residual: true
  # Time frequencies ~ N(0, 30^2) per unit of normalised t (window = 240 s):
  # periods from ~20 s up; scale 1 gives >= ~500 s, too smooth for the pulse
  fourier_scale_t: 30.0

physics:
  wse_still: 0.4
  h_dry: 0.01
  gravity: 9.81

boundary_conditions:
  # Inflow pulse after a 360 s spin-up; t in s, Q in m^3/s.
  # Must match data/hydrograph/inflow_hydrograph.xys (t in h there).
  1:
    type: "inlet-q"
    hydrograph: [[0.0, 0.38], [360.0, 0.38], [390.0, 0.76], [480.0, 0.38], [600.0, 0.38]]
  2: {type: "exit-h",  value: 0.4}
  3: {type: "wall"}
  4: {type: "wall"}
  5: {type: "wall"}

initial_condition:
  mode: "srh2d-snapshot"      # SRH-2D state at t_start = 360 s (end of spin-up)

data:
  srhhydro: "data/block_in_channel.srhhydro"   # mesh + materials (BCs come from this YAML)
  srh2d_h5_file: "data/hydrograph/block_in_channel_hydrograph_XMDFC.h5"
  measurements:
    mode: "both"
    n_points: 10              # same 10 depth gauges as BICU-B
    fixed_locations: true
    sparse_times: []
    variables: ["xi"]
    noise_sigma: 0.0
    seed: 42
    # Dense full-state snapshots every 30 s; the 10 s outputs in between are held out
    dense_times: [360.0, 390.0, 420.0, 450.0, 480.0, 510.0, 540.0, 570.0, 600.0]
evaluation:
  # Rise 360-390 s, peak 390 s, recession to 480 s. Odd multiples of 10 s are
  # never dense snapshots (those are every 30 s), so they are held out in E/H.
  times: [370.0, 380.0, 390.0, 400.0, 420.0, 450.0, 480.0, 540.0, 600.0]

training:
  strategy: "standard"
  t_start: 360.0
  t_end:   600.0

  adam_epochs: 8000
  adam_lr: 1.0e-3
  adam_lr_decay: 0.5
  adam_decay_every: 2000
  lbfgs_epochs: 500
  n_time_samples: 10

  loss_weights:
    lambda_fvm:  1.0
    lambda_ic:   10.0
    lambda_bc:   30.0
    lambda_data: 10.0

  component_weights:
    lambda_xi: 1.0
    lambda_hu: 1.0
    lambda_hv: 1.0

  use_grad_checkpoint: false

  logging:
    print_freq: 100
    save_freq: 1000
    checkpoint_dir: "./checkpoints/BICU_ET"
